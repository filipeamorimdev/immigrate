resources:
  limits:
    cpus: 2
    memory: 4096

TZ: Etc/UTC

immigrate:
  immich_url: ""
  immich_api_key: ""
  log_level: INFO
  additional_envs: []

run_as:
  user: 568
  group: 568

network:
  web_port:
    bind_mode: published
    port_number: 8080
  host_network: false

ix_volumes:
  data: /opt/tests/mnt/immigrate/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  nas:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/immigrate/nas
      create_host_path: true
