{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.immigrate_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{# The library drops all capabilities and sets no-new-privileges by default. #}
{% do c1.set_read_only(true) %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_test("http", {"port": values.network.web_port.port_number, "path": "/healthz"}) %}

{% do c1.environment.add_env("IMMIGRATE_HOST", "0.0.0.0") %}
{% do c1.environment.add_env("IMMIGRATE_PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("DATA_DIR", values.consts.data_path) %}
{% do c1.environment.add_env("LIBRARY_ROOT", values.consts.nas_path) %}
{# The root filesystem is read-only, so home and temporary files live in the data storage. #}
{% do c1.environment.add_env("HOME", values.consts.data_path) %}
{% do c1.environment.add_env("TMPDIR", "%s/tmp" | format(values.consts.data_path)) %}
{% do c1.environment.add_env("LOG_LEVEL", values.immigrate.log_level) %}
{% if values.immigrate.immich_url %}
  {% do c1.environment.add_env("IMMICH_URL", values.immigrate.immich_url) %}
{% endif %}
{% if values.immigrate.immich_api_key %}
  {% do c1.environment.add_env("IMMICH_API_KEY", values.immigrate.immich_api_key) %}
{% endif %}
{% do c1.environment.add_user_envs(values.immigrate.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage("/run", {"type": "tmpfs", "tmpfs_config": {"uid": values.run_as.user, "gid": values.run_as.group}}) %}

{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{# The Photos library is always mounted read-only, and its permissions are never changed. #}
{% do c1.add_storage(values.consts.nas_path, dict(values.storage.nas, **{"read_only": true})) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
